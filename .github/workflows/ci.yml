name: CI
run-name: CI ${{ inputs.checkout_ref || github.sha }} ${{ inputs.request_id || '' }}

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Exact 40-character commit SHA to validate
        required: true
        type: string
      request_id:
        description: Internal unique exact-SHA CI request ID
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.request_id || inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          path: source
          persist-credentials: false
      - name: verify exact source
        if: github.event_name == 'workflow_dispatch'
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.checkout_ref }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: source/go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.57.0"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: source/.node-version
      - name: gofmt
        id: gofmt
        working-directory: source
        run: just fmt-check
      - name: vet
        id: vet
        working-directory: source
        run: just vet
      - name: golangci-lint
        id: golangci_lint
        working-directory: source
        run: just lint
      - name: govulncheck
        id: govulncheck
        working-directory: source
        run: just vuln
      - name: scripts
        id: scripts
        working-directory: source
        run: just scripts-check
        env:
          GATE_REQUIRE_INSTALL_PTY_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Linux low-port capability
        id: linux_low_port
        if: runner.os == 'Linux'
        run: just linux-low-port-test
        env:
          GATE_RUN_LINUX_LOW_PORT_TEST: "1"
          GATE_REQUIRE_LINUX_LOW_PORT_TEST: "1"
        working-directory: source
      - name: enable corepack
        run: corepack enable
      - name: install node dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: node check
        id: node_check
        working-directory: source
        run: just node-check
      - name: test
        id: test
        working-directory: source
        run: just cover
        env:
          GATE_REQUIRE_INSTALL_PTY_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: cross-build release targets
        if: runner.os == 'Linux'
        working-directory: source
        run: just build-all ci
      - name: job summary
        if: always()
        run: bash tooling/.github/scripts/check-summary.sh
        env:
          RUNNER_OS_NAME: ${{ matrix.os }}
          SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
          GOFMT_OUTCOME: ${{ steps.gofmt.outcome }}
          VET_OUTCOME: ${{ steps.vet.outcome }}
          GOLANGCI_LINT_OUTCOME: ${{ steps.golangci_lint.outcome }}
          GOVULNCHECK_OUTCOME: ${{ steps.govulncheck.outcome }}
          SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
          LINUX_LOW_PORT_OUTCOME: ${{ steps.linux_low_port.outcome || 'not run' }}
          NODE_CHECK_OUTCOME: ${{ steps.node_check.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
