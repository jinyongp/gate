name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: build developer tool
        run: go build -trimpath -o "$RUNNER_TEMP/gate-dev" ./cmd/gate-dev
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: gofmt
        id: gofmt
        run: '"$RUNNER_TEMP/gate-dev" fmt-check'
      - name: vet
        id: vet
        run: '"$RUNNER_TEMP/gate-dev" vet'
      - name: golangci-lint
        id: golangci_lint
        run: '"$RUNNER_TEMP/gate-dev" lint'
      - name: govulncheck
        id: govulncheck
        run: '"$RUNNER_TEMP/gate-dev" vuln'
      - name: scripts
        id: scripts
        run: scripts/dev/check-scripts.sh
        env:
          GATE_REQUIRE_INSTALL_PTY_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Linux low-port capability
        id: linux_low_port
        if: runner.os == 'Linux'
        run: scripts/dev/test-linux-low-ports.sh
        env:
          GATE_REQUIRE_LINUX_LOW_PORT_TEST: "1"
      - name: enable corepack
        run: corepack enable
      - name: install node dependencies
        run: pnpm install --frozen-lockfile
      - name: node check
        id: node_check
        run: pnpm node:check
      - name: test
        id: test
        run: '"$RUNNER_TEMP/gate-dev" cover'
      - name: cross-build release targets
        if: runner.os == 'Linux'
        run: '"$RUNNER_TEMP/gate-dev" build-all ci "$RUNNER_TEMP/gate-cross"'
      - name: job summary
        if: always()
        run: bash .github/scripts/check-summary.sh
        env:
          RUNNER_OS_NAME: ${{ matrix.os }}
          GOFMT_OUTCOME: ${{ steps.gofmt.outcome }}
          VET_OUTCOME: ${{ steps.vet.outcome }}
          GOLANGCI_LINT_OUTCOME: ${{ steps.golangci_lint.outcome }}
          GOVULNCHECK_OUTCOME: ${{ steps.govulncheck.outcome }}
          SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
          LINUX_LOW_PORT_OUTCOME: ${{ steps.linux_low_port.outcome || 'not run' }}
          NODE_CHECK_OUTCOME: ${{ steps.node_check.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
