name: CI
run-name: CI · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: ./tooling/.github/actions/preflight
        with:
          source-path: source
          source-sha: ${{ github.sha }}
          runner-label: ${{ matrix.os }}
          cross-build: "true"
