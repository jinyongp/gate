name: Release

on:
  repository_dispatch:
    types:
      - release

concurrency:
  group: release-stable
  queue: max

permissions:
  contents: read

jobs:
  release_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      type: ${{ steps.release_tag.outputs.type }}
      target: ${{ steps.release_tag.outputs.target }}
      object: ${{ steps.release_tag.outputs.object }}
      release: ${{ steps.release_tag.outputs.release }}
      on_main: ${{ steps.release_tag.outputs.on_main }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: tooling/go.sum
      - name: build developer tool
        working-directory: tooling
        run: go build -trimpath -o "$RUNNER_TEMP/gate-dev" ./cmd/gate-dev
      - name: detect release tag
        id: release_tag
        working-directory: tooling
        run: '"$RUNNER_TEMP/gate-dev" ci detect-release-tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_RELEASE_TAG: ${{ github.event.client_payload.tag }}
          GATE_RELEASE_TARGET_SHA: ${{ github.event.client_payload.target_sha }}
          GATE_RELEASE_TAG_OBJECT: ${{ github.event.client_payload.tag_object }}
          GATE_REQUIRE_RELEASE_TAG: "1"

  ci_dispatch:
    needs: [release_tag]
    if: |
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: tooling/go.sum
      - name: build developer tool
        working-directory: tooling
        run: go build -trimpath -o "$RUNNER_TEMP/gate-dev" ./cmd/gate-dev
      - name: dispatch exact release commit CI
        working-directory: tooling
        run: '"$RUNNER_TEMP/gate-dev" ci dispatch-ci "${{ needs.release_tag.outputs.target }}" "$CI_REQUEST_ID"'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REQUEST_ID: release-${{ github.run_id }}-${{ github.run_attempt }}

  ci_gate:
    needs: [release_tag, ci_dispatch]
    if: |
      always() &&
      needs.release_tag.result == 'success' &&
      (needs.ci_dispatch.result == 'success' || needs.ci_dispatch.result == 'skipped') &&
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: tooling/go.sum
      - name: build developer tool
        working-directory: tooling
        run: go build -trimpath -o "$RUNNER_TEMP/gate-dev" ./cmd/gate-dev
      - name: wait for CI on release commit
        working-directory: tooling
        run: '"$RUNNER_TEMP/gate-dev" ci wait-for-ci "${{ needs.release_tag.outputs.target }}" "$CI_REQUEST_ID"'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REQUEST_ID: release-${{ github.run_id }}-${{ github.run_attempt }}

  build:
    needs: [release_tag, ci_gate]
    if: |
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true' &&
      needs.ci_gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release_tag.outputs.target }}
          path: source
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: tooling/go.sum
      - name: build developer tool
        working-directory: tooling
        run: go build -trimpath -o "$RUNNER_TEMP/gate-dev" ./cmd/gate-dev
      - name: build
        id: build
        working-directory: source
        run: '"$RUNNER_TEMP/gate-dev" ci build-release-artifacts "${{ needs.release_tag.outputs.tag }}"'
      - id: upload_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-${{ needs.release_tag.outputs.target }}
          path: |
            source/gate-darwin-amd64
            source/gate-darwin-arm64
            source/gate-linux-amd64
            source/gate-linux-arm64
      - name: checksums
        id: checksums
        working-directory: source
        run: '"$RUNNER_TEMP/gate-dev" ci checksums'
      - name: publish release
        id: publish_release
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_RELEASE_TARGET_SHA: ${{ needs.release_tag.outputs.target }}
          GATE_RELEASE_TAG_OBJECT: ${{ needs.release_tag.outputs.object }}
        run: '"$RUNNER_TEMP/gate-dev" ci publish-release "${{ needs.release_tag.outputs.tag }}"'
      - name: job summary
        if: always()
        working-directory: source
        run: bash ../tooling/.github/scripts/build-summary.sh
        env:
          BUILD_VERSION: ${{ steps.build.outputs.version || 'not built' }}
          RELEASE_TAG: ${{ needs.release_tag.outputs.tag }}
          TAG_TYPE: ${{ needs.release_tag.outputs.type }}
          TAG_TARGET: ${{ needs.release_tag.outputs.target }}
          TAG_OBJECT: ${{ needs.release_tag.outputs.object }}
          TAG_ON_MAIN: ${{ needs.release_tag.outputs.on_main }}
          RELEASE_STATUS: ${{ needs.release_tag.outputs.release }}
          DETECT_TAG_OUTCOME: success
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          CHECKSUMS_OUTCOME: ${{ steps.checksums.outcome }}
          PUBLISH_RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}

  homebrew_tap:
    needs: [release_tag, build]
    if: |
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true' &&
      needs.build.result == 'success'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release_tag.outputs.target }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: jinyongp/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: tooling/go.sum
      - name: build developer tool
        working-directory: tooling
        run: go build -trimpath -o "$RUNNER_TEMP/gate-dev" ./cmd/gate-dev
      - name: wait for release assets
        id: wait_release_assets
        run: '"$RUNNER_TEMP/gate-dev" ci wait-release-assets "${VERSION_TAG}"'
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
      - name: generate binary formula
        id: generate_formula
        run: '"$RUNNER_TEMP/gate-dev" ci generate-homebrew-formula tap "${VERSION_TAG}"'
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
      - name: verify release tag target
        working-directory: source
        run: '"$RUNNER_TEMP/gate-dev" ci verify-release-tag-target "${VERSION_TAG}" "${RELEASE_TARGET}" "${RELEASE_OBJECT}"'
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          RELEASE_TARGET: ${{ needs.release_tag.outputs.target }}
          RELEASE_OBJECT: ${{ needs.release_tag.outputs.object }}
      - name: commit formula
        id: commit_formula
        working-directory: tap
        run: bash .github/workflows/scripts/commit-formula.sh
        env:
          FORMULA_PATH: Formula/gate.rb
          FORMULA: gate
          VERSION: ${{ needs.release_tag.outputs.tag }}
      - name: tap formula
        id: tap_formula
        run: brew tap jinyongp/tap "$GITHUB_WORKSPACE/tap"
      - name: audit formula
        id: audit_formula
        run: brew audit --strict jinyongp/tap/gate
      - name: install formula
        id: install_formula
        run: brew install jinyongp/tap/gate
      - name: test formula
        id: test_formula
        run: brew test jinyongp/tap/gate
      - name: verify release tag before formula push
        if: steps.commit_formula.outputs.changed == 'true'
        working-directory: source
        run: '"$RUNNER_TEMP/gate-dev" ci verify-release-tag-target "${VERSION_TAG}" "${RELEASE_TARGET}" "${RELEASE_OBJECT}"'
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          RELEASE_TARGET: ${{ needs.release_tag.outputs.target }}
          RELEASE_OBJECT: ${{ needs.release_tag.outputs.object }}
      - name: push formula
        id: push_formula
        if: steps.commit_formula.outputs.changed == 'true'
        working-directory: tap
        run: bash .github/workflows/scripts/push-formula.sh
      - name: job summary
        if: always()
        run: bash tooling/.github/scripts/homebrew-summary.sh
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          RELEASE_TARGET: ${{ needs.release_tag.outputs.target }}
          RELEASE_OBJECT: ${{ needs.release_tag.outputs.object }}
          WAIT_RELEASE_ASSETS_OUTCOME: ${{ steps.wait_release_assets.outcome || 'not run' }}
          GENERATE_FORMULA_OUTCOME: ${{ steps.generate_formula.outcome || 'not run' }}
          COMMIT_FORMULA_OUTCOME: ${{ steps.commit_formula.outcome || 'not run' }}
          FORMULA_CHANGED: ${{ steps.commit_formula.outputs.changed || 'unknown' }}
          TAP_FORMULA_OUTCOME: ${{ steps.tap_formula.outcome || 'not run' }}
          AUDIT_FORMULA_OUTCOME: ${{ steps.audit_formula.outcome || 'not run' }}
          INSTALL_FORMULA_OUTCOME: ${{ steps.install_formula.outcome || 'not run' }}
          TEST_FORMULA_OUTCOME: ${{ steps.test_formula.outcome || 'not run' }}
          PUSH_FORMULA_OUTCOME: ${{ steps.push_formula.outcome || 'not run' }}

  npm_publish:
    needs: [release_tag, build]
    if: |
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release_tag.outputs.target }}
          path: source
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: tooling/go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: source/.node-version
          registry-url: https://registry.npmjs.org
      - name: build developer tool
        working-directory: tooling
        run: go build -trimpath -o "$RUNNER_TEMP/gate-dev" ./cmd/gate-dev
      - name: enable corepack
        id: corepack
        run: corepack enable
      - name: install
        id: install
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: download release binaries
        id: build_binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gate-${{ needs.release_tag.outputs.target }}
          path: source/bin
      - name: verify release tag target
        working-directory: source
        run: '"$RUNNER_TEMP/gate-dev" ci verify-release-tag-target "${VERSION_TAG}" "${RELEASE_TARGET}" "${RELEASE_OBJECT}"'
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          RELEASE_TARGET: ${{ needs.release_tag.outputs.target }}
          RELEASE_OBJECT: ${{ needs.release_tag.outputs.object }}
      - name: publish npm packages
        id: publish_npm
        working-directory: source
        run: node ../tooling/scripts/node/publish-packages.mjs "${VERSION_TAG}" bin
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          GATE_RELEASE_TARGET_SHA: ${{ needs.release_tag.outputs.target }}
          GATE_RELEASE_TAG_OBJECT: ${{ needs.release_tag.outputs.object }}
          NPM_PUBLISH_SUMMARY: npm-publish-summary.tsv
      - name: job summary
        if: always()
        run: bash tooling/.github/scripts/npm-summary.sh
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          RELEASE_TARGET: ${{ needs.release_tag.outputs.target }}
          RELEASE_OBJECT: ${{ needs.release_tag.outputs.object }}
          COREPACK_OUTCOME: ${{ steps.corepack.outcome || 'not run' }}
          INSTALL_OUTCOME: ${{ steps.install.outcome || 'not run' }}
          BUILD_BINARIES_OUTCOME: ${{ steps.build_binaries.outcome || 'not run' }}
          PUBLISH_NPM_OUTCOME: ${{ steps.publish_npm.outcome || 'not run' }}
          NPM_PUBLISH_SUMMARY: source/npm-publish-summary.tsv

  release_summary:
    needs: [release_tag, ci_dispatch, ci_gate, build, homebrew_tap, npm_publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
      - name: job summary
        run: bash tooling/.github/scripts/release-summary.sh
        env:
          RELEASE_TAG: ${{ needs.release_tag.outputs.tag }}
          TAG_TYPE: ${{ needs.release_tag.outputs.type || 'none' }}
          TAG_TARGET: ${{ needs.release_tag.outputs.target }}
          TAG_OBJECT: ${{ needs.release_tag.outputs.object }}
          TAG_ON_MAIN: ${{ needs.release_tag.outputs.on_main || 'false' }}
          RELEASE_STATUS: ${{ needs.release_tag.outputs.release || 'unknown' }}
          RELEASE_TAG_JOB_RESULT: ${{ needs.release_tag.result }}
          CI_DISPATCH_JOB_RESULT: ${{ needs.ci_dispatch.result }}
          CI_GATE_JOB_RESULT: ${{ needs.ci_gate.result }}
          BUILD_JOB_RESULT: ${{ needs.build.result }}
          HOMEBREW_TAP_JOB_RESULT: ${{ needs.homebrew_tap.result }}
          NPM_PUBLISH_JOB_RESULT: ${{ needs.npm_publish.result }}
