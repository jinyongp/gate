name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      type: ${{ steps.release_tag.outputs.type }}
      target: ${{ steps.release_tag.outputs.target }}
      release: ${{ steps.release_tag.outputs.release }}
      on_main: ${{ steps.release_tag.outputs.on_main }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: detect release tag
        id: release_tag
        run: bash .github/scripts/detect-release-tag.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    needs: [release_tag]
    if: |
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: gofmt
        id: gofmt
        run: scripts/dev/fmt-check.sh
      - name: vet
        id: vet
        run: scripts/dev/vet.sh
      - name: golangci-lint
        id: golangci_lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
      - name: govulncheck
        id: govulncheck
        run: scripts/dev/vuln.sh
      - name: scripts
        id: scripts
        run: scripts/dev/check-scripts.sh
      - name: enable corepack
        run: corepack enable
      - name: install node dependencies
        run: pnpm install --frozen-lockfile
      - name: node check
        id: node_check
        run: pnpm node:check
      - name: test
        id: test
        run: scripts/dev/cover.sh
      - name: job summary
        if: always()
        run: bash .github/scripts/check-summary.sh
        env:
          RUNNER_OS_NAME: ${{ matrix.os }}
          GOFMT_OUTCOME: ${{ steps.gofmt.outcome }}
          VET_OUTCOME: ${{ steps.vet.outcome }}
          GOLANGCI_LINT_OUTCOME: ${{ steps.golangci_lint.outcome }}
          GOVULNCHECK_OUTCOME: ${{ steps.govulncheck.outcome }}
          SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
          NODE_CHECK_OUTCOME: ${{ steps.node_check.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}

  build:
    needs: [release_tag, check]
    if: |
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true' &&
      needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
      - name: build
        id: build
        run: bash .github/scripts/build-release-artifacts.sh "${{ needs.release_tag.outputs.tag }}"
      - id: upload_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-${{ github.sha }}
          path: |
            gate-darwin-amd64
            gate-darwin-arm64
            gate-linux-amd64
            gate-linux-arm64
      - name: checksums
        id: checksums
        run: bash .github/scripts/checksums.sh
      - name: publish release
        id: publish_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-release.sh "${{ needs.release_tag.outputs.tag }}"
      - name: job summary
        if: always()
        run: bash .github/scripts/build-summary.sh
        env:
          BUILD_VERSION: ${{ steps.build.outputs.version || 'not built' }}
          RELEASE_TAG: ${{ needs.release_tag.outputs.tag }}
          TAG_TYPE: ${{ needs.release_tag.outputs.type }}
          TAG_TARGET: ${{ needs.release_tag.outputs.target }}
          TAG_ON_MAIN: ${{ needs.release_tag.outputs.on_main }}
          RELEASE_STATUS: ${{ needs.release_tag.outputs.release }}
          DETECT_TAG_OUTCOME: success
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          CHECKSUMS_OUTCOME: ${{ steps.checksums.outcome }}
          PUBLISH_RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}

  homebrew_tap:
    needs: [release_tag, build]
    if: |
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true' &&
      needs.build.result == 'success'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: jinyongp/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
          fetch-depth: 0
      - name: wait for release assets
        id: wait_release_assets
        run: bash source/.github/scripts/wait-release-assets.sh "${VERSION_TAG}"
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
      - name: generate binary formula
        id: generate_formula
        run: bash source/.github/scripts/generate-homebrew-binary-formula.sh tap "${VERSION_TAG}"
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
      - name: commit formula
        id: commit_formula
        working-directory: tap
        run: bash .github/workflows/scripts/commit-formula.sh
        env:
          FORMULA_PATH: Formula/gate.rb
          FORMULA: gate
          VERSION: ${{ needs.release_tag.outputs.tag }}
      - name: tap formula
        id: tap_formula
        run: brew tap jinyongp/tap "$GITHUB_WORKSPACE/tap"
      - name: audit formula
        id: audit_formula
        run: brew audit --strict jinyongp/tap/gate
      - name: install formula
        id: install_formula
        run: brew install jinyongp/tap/gate
      - name: test formula
        id: test_formula
        run: brew test jinyongp/tap/gate
      - name: push formula
        id: push_formula
        if: steps.commit_formula.outputs.changed == 'true'
        working-directory: tap
        run: bash .github/workflows/scripts/push-formula.sh
      - name: job summary
        if: always()
        run: bash source/.github/scripts/homebrew-summary.sh
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          WAIT_RELEASE_ASSETS_OUTCOME: ${{ steps.wait_release_assets.outcome || 'not run' }}
          GENERATE_FORMULA_OUTCOME: ${{ steps.generate_formula.outcome || 'not run' }}
          COMMIT_FORMULA_OUTCOME: ${{ steps.commit_formula.outcome || 'not run' }}
          FORMULA_CHANGED: ${{ steps.commit_formula.outputs.changed || 'unknown' }}
          TAP_FORMULA_OUTCOME: ${{ steps.tap_formula.outcome || 'not run' }}
          AUDIT_FORMULA_OUTCOME: ${{ steps.audit_formula.outcome || 'not run' }}
          INSTALL_FORMULA_OUTCOME: ${{ steps.install_formula.outcome || 'not run' }}
          TEST_FORMULA_OUTCOME: ${{ steps.test_formula.outcome || 'not run' }}
          PUSH_FORMULA_OUTCOME: ${{ steps.push_formula.outcome || 'not run' }}

  npm_publish:
    needs: [release_tag, build]
    if: |
      needs.release_tag.outputs.tag != '' &&
      needs.release_tag.outputs.on_main == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: enable corepack
        id: corepack
        run: corepack enable
      - name: install
        id: install
        run: pnpm install --frozen-lockfile
      - name: build release binaries
        id: build_binaries
        run: scripts/release/build-gate.sh "${VERSION_TAG}" bin
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
      - name: publish npm packages
        id: publish_npm
        run: bash .github/scripts/publish-npm.sh "${VERSION_TAG}" bin
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          NPM_PUBLISH_SUMMARY: npm-publish-summary.tsv
      - name: job summary
        if: always()
        run: bash .github/scripts/npm-summary.sh
        env:
          VERSION_TAG: ${{ needs.release_tag.outputs.tag }}
          COREPACK_OUTCOME: ${{ steps.corepack.outcome || 'not run' }}
          INSTALL_OUTCOME: ${{ steps.install.outcome || 'not run' }}
          BUILD_BINARIES_OUTCOME: ${{ steps.build_binaries.outcome || 'not run' }}
          PUBLISH_NPM_OUTCOME: ${{ steps.publish_npm.outcome || 'not run' }}
          NPM_PUBLISH_SUMMARY: npm-publish-summary.tsv

  release_summary:
    needs: [release_tag, check, build, homebrew_tap, npm_publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: job summary
        run: bash .github/scripts/release-summary.sh
        env:
          RELEASE_TAG: ${{ needs.release_tag.outputs.tag }}
          TAG_TYPE: ${{ needs.release_tag.outputs.type || 'none' }}
          TAG_TARGET: ${{ needs.release_tag.outputs.target }}
          TAG_ON_MAIN: ${{ needs.release_tag.outputs.on_main || 'false' }}
          RELEASE_STATUS: ${{ needs.release_tag.outputs.release || 'unknown' }}
          RELEASE_TAG_JOB_RESULT: ${{ needs.release_tag.result }}
          CHECK_JOB_RESULT: ${{ needs.check.result }}
          BUILD_JOB_RESULT: ${{ needs.build.result }}
          HOMEBREW_TAP_JOB_RESULT: ${{ needs.homebrew_tap.result }}
          NPM_PUBLISH_JOB_RESULT: ${{ needs.npm_publish.result }}
