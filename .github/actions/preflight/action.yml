name: Preflight
description: Run gate validation for one operating system

inputs:
  source-path:
    description: Path to the source checkout
    required: true
  source-sha:
    description: Exact commit SHA expected in the source checkout
    required: true
  runner-label:
    description: Matrix runner label shown in the job summary
    required: true
  cross-build:
    description: Whether Linux should cross-build every release target
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: verify exact source
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source-sha }}
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: "1.26.x"
        check-latest: true
        cache-dependency-path: ${{ inputs.source-path }}/go.sum
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: "1.57.0"
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ${{ inputs.source-path }}/.node-version
    - name: gofmt
      id: gofmt
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just fmt-check
    - name: vet
      id: vet
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just vet
    - name: golangci-lint
      id: golangci_lint
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just lint
    - name: govulncheck
      id: govulncheck
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just vuln
    - name: scripts
      id: scripts
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just scripts-check
      env:
        GATE_REQUIRE_INSTALL_PTY_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
    - name: Linux low-port capability
      id: linux_low_port
      if: runner.os == 'Linux'
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just linux-low-port-test
      env:
        GATE_RUN_LINUX_LOW_PORT_TEST: "1"
        GATE_REQUIRE_LINUX_LOW_PORT_TEST: "1"
    - name: enable corepack
      shell: bash
      run: corepack enable
    - name: install node dependencies
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: node check
      id: node_check
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just node-check
    - name: test
      id: test
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just cover
      env:
        GATE_REQUIRE_INSTALL_PTY_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
    - name: cross-build release targets
      if: inputs.cross-build == 'true' && runner.os == 'Linux'
      working-directory: ${{ inputs.source-path }}
      shell: bash
      run: just build-all ci
    - name: job summary
      if: always()
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../scripts/check-summary.sh"
      env:
        RUNNER_OS_NAME: ${{ inputs.runner-label }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        GOFMT_OUTCOME: ${{ steps.gofmt.outcome }}
        VET_OUTCOME: ${{ steps.vet.outcome }}
        GOLANGCI_LINT_OUTCOME: ${{ steps.golangci_lint.outcome }}
        GOVULNCHECK_OUTCOME: ${{ steps.govulncheck.outcome }}
        SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
        LINUX_LOW_PORT_OUTCOME: ${{ steps.linux_low_port.outcome || 'not run' }}
        NODE_CHECK_OUTCOME: ${{ steps.node_check.outcome }}
        TEST_OUTCOME: ${{ steps.test.outcome }}
